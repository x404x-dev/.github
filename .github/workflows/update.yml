name: Generate Profile README.md

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate README from Template
        run: |
          USERNAME="${{ github.repository_owner }}"
          DISPLAYNAME=$(curl -s https://api.github.com/users/$USERNAME | jq -r '.name // .login')
          mkdir -p profile

          TEMPLATE_PATH="src/README.md"
          OUTPUT_PATH="profile/README.md"

          if [ -f "$TEMPLATE_PATH" ]; then
            sed -e "s|%{USERNAME}%|$USERNAME|g" -e "s|%{DISPLAYNAME}%|$DISPLAYNAME|g" "$TEMPLATE_PATH" > "$OUTPUT_PATH"
            python3 -c "
          import os, json, sys

          username, output_path = '$USERNAME', '$OUTPUT_PATH'
          icons_dir, config_path = 'src/icons', 'src/icons.json'

          links = {}
          if os.path.exists(config_path):
              try:
                  with open(config_path, 'r', encoding='utf-8') as f:
                      links = json.load(f)
              except Exception:
                  links = {}

          files, icon_map = os.listdir(icons_dir) if os.path.exists(icons_dir) else [], {}
          for filename in files:
              if not filename.endswith('.svg'):
                  continue
              if filename.endswith('-Dark.svg'):
                  base = filename[:-9]
                  icon_map.setdefault(base, {})['dark'] = filename
              elif filename.endswith('-Light.svg'):
                  base = filename[:-10]
                  icon_map.setdefault(base, {})['light'] = filename
              else:
                  base = filename[:-4]
                  icon_map.setdefault(base, {})['single'] = filename

          json_updated, icons_html = False, []
          for base in sorted(icon_map.keys(), key=lambda s: s.lower()):
              if base not in links:
                  links[base], json_updated = '', True
              link = links[base].strip() if links[base].strip() != '' else f'https://github.com/{username}'
              data = icon_map[base]

              if 'dark' in data and 'light' in data:
                  dark_url = f'https://raw.githubusercontent.com/{username}/.github/refs/heads/main/src/icons/{data[\"dark\"]}'
                  light_url = f'https://raw.githubusercontent.com/{username}/.github/refs/heads/main/src/icons/{data[\"light\"]}'
                  html = f'  <a href=\"{link}\" target=\"_blank\" rel=\"noreferrer\"><picture><source media=\"(prefers-color-scheme: dark)\" srcset=\"{dark_url}\" /><img src=\"{light_url}\" alt=\"{base}\" width=\"40\" height=\"40\"/></picture></a>&nbsp;\n'
              else:
                  file_single = data.get('single', data.get('light', data.get('dark')))
                  img_url = f'https://raw.githubusercontent.com/{username}/.github/refs/heads/main/src/icons/{file_single}'
                  html = f'  <a href=\"{link}\" target=\"_blank\" rel=\"noreferrer\"><picture><img src=\"{img_url}\" alt=\"{base}\" width=\"40\" height=\"40\"/></picture></a>&nbsp;\n'
              icons_html.append(html)

          if json_updated:
              sorted_links = {k: links[k] for k in sorted(links.keys(), key=lambda s: s.lower())}
              with open(config_path, 'w', encoding='utf-8') as f:
                  json.dump(sorted_links, f, indent=2, ensure_ascii=False)
              echo_msg = 'Updated src/icons.json with new missing icon keys'
          else:
              echo_msg = 'src/icons.json is up to date'
          final_html = ''.join(icons_html)

          with open(output_path, 'r', encoding='utf-8') as f:
              content = f.read()
          content = content.replace('%{LANGUAGES&TOOLS}%', final_html)

          with open(output_path, 'w', encoding='utf-8') as f:
              f.write(content)
          print(echo_msg)
            "
            echo "Successfully generated $OUTPUT_PATH with sorted icons and links"
          else
            echo "Error: Template file $TEMPLATE_PATH not found!"
            exit 1
          fi

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: main
          file_pattern: 'profile/README.md src/icons.json'
          commit_message: "docs: update profile/README.md & icons.json [skip ci]"

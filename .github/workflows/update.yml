name: Generate Profile README.md

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate README from Template
        run: |
          USERNAME="${{ github.repository_owner }}"
          DISPLAYNAME=$(curl -s https://api.github.com/users/$USERNAME | jq -r '.name // .login')
          mkdir -p profile

          TEMPLATE_PATH="src/README.md"
          OUTPUT_PATH="profile/README.md"

          ICONS_HTML=""
          for icon in $(ls src/icons/*.svg | sort -f); do
            filename=$(basename "$icon")
            if [[ "$filename" == *-Dark.svg ]]; then
              base="${filename%-Dark.svg}"
              light_file="${base}-Light.svg"
              if [ -f "src/icons/$light_file" ]; then
                ICONS_HTML+="  <picture><source media=\"(prefers-color-scheme: dark)\" srcset=\"https://raw.githubusercontent.com/$USERNAME/.github/refs/heads/main/src/icons/$filename\" /><img src=\"https://raw.githubusercontent.com/$USERNAME/.github/refs/heads/main/src/icons/$light_file\" alt=\"$base\" width=\"40\" height=\"40\"/></picture>&nbsp;\n"
              fi
            elif [[ "$filename" == *-Light.svg ]]; then
              continue
            else
              name="${filename%.svg}"
              ICONS_HTML+="  <picture><img src=\"https://raw.githubusercontent.com/$USERNAME/.github/refs/heads/main/src/icons/$filename\" alt=\"$name\" width=\"40\" height=\"40\"/></picture>&nbsp;\n"
            fi
          done

          if [ -f "$TEMPLATE_PATH" ]; then
            sed -e "s|%{USERNAME}%|$USERNAME|g" -e "s|%{DISPLAYNAME}%|$DISPLAYNAME|g" "$TEMPLATE_PATH" > "$OUTPUT_PATH"
            python3 -c "
          import sys
          with open('$OUTPUT_PATH', 'r') as f:
              content = f.read()
          content = content.replace('%{LANGUAGES&TOOLS}%', '''$ICONS_HTML''')
          with open('$OUTPUT_PATH', 'w') as f:
              f.write(content)
            "
            echo "Successfully generated $OUTPUT_PATH with sorted icons"
          else
            echo "Error: Template file $TEMPLATE_PATH not found!"
            exit 1
          fi

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: main
          file_pattern: 'profile/README.md'
          commit_message: "docs: update profile/README.md with current name [skip ci]"
